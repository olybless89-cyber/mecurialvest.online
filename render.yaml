services:
  - type: web
    name: nexbank-api
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install --frozen-lockfile && cd artifacts/api-server && pnpm run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false   # Set in Render dashboard — your Supabase connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RESEND_API_KEY
        sync: false   # Set in Render dashboard — get from resend.com
      - key: FROM_EMAIL
        sync: false   # e.g. NexBank <noreply@yourdomain.com>
      - key: FRONTEND_URL
        sync: false   # Your Netlify URL e.g. https://nexbank.netlify.app
