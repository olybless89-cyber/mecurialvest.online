openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: NexBank Digital Banking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: accounts
    description: Bank accounts
  - name: transactions
    description: Transaction history
  - name: transfers
    description: Money transfers
  - name: beneficiaries
    description: Saved recipients
  - name: notifications
    description: Notifications
  - name: profile
    description: User profile
  - name: admin
    description: Admin operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ──────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenInput"
      responses:
        "200":
          description: Email verified

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInput"
      responses:
        "200":
          description: Reset email sent

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset

  # ── ACCOUNTS ──────────────────────────────────────────────────────────
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List user accounts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Accounts list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListResponse"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create a new account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"

  /accounts/stats:
    get:
      operationId: getAccountStats
      tags: [accounts]
      summary: Get total balance and account count
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatsResponse"

  /accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get account by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Update account nickname
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Account updated

  /accounts/{id}/freeze:
    post:
      operationId: freezeAccount
      tags: [accounts]
      summary: Freeze account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account frozen

  /accounts/{id}/unfreeze:
    post:
      operationId: unfreezeAccount
      tags: [accounts]
      summary: Unfreeze account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account unfrozen

  /accounts/{id}/transactions:
    get:
      operationId: getAccountTransactions
      tags: [accounts]
      summary: Get transactions for an account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPageResponse"

  # ── TRANSACTIONS ───────────────────────────────────────────────────────
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions with filters
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPageResponse"

  /transactions/summary:
    get:
      operationId: getTransactionSummary
      tags: [transactions]
      summary: Monthly income, expenses, transaction count
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionSummaryResponse"

  /transactions/trend:
    get:
      operationId: getSpendingTrend
      tags: [transactions]
      summary: Last 6 months income vs expenses trend
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Spending trend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get transaction by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"

  # ── TRANSFERS ─────────────────────────────────────────────────────────
  /transfers/internal:
    post:
      operationId: internalTransfer
      tags: [transfers]
      summary: Transfer between own accounts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalTransferInput"
      responses:
        "200":
          description: Transfer completed

  /transfers/external:
    post:
      operationId: externalTransfer
      tags: [transfers]
      summary: Wire transfer to external account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalTransferInput"
      responses:
        "200":
          description: Transfer submitted

  # ── BENEFICIARIES ─────────────────────────────────────────────────────
  /beneficiaries:
    get:
      operationId: listBeneficiaries
      tags: [beneficiaries]
      summary: List saved beneficiaries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Beneficiaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeneficiaryListResponse"
    post:
      operationId: createBeneficiary
      tags: [beneficiaries]
      summary: Add beneficiary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeneficiaryInput"
      responses:
        "201":
          description: Beneficiary added

  /beneficiaries/{id}:
    patch:
      operationId: updateBeneficiary
      tags: [beneficiaries]
      summary: Update beneficiary
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeneficiaryUpdate"
      responses:
        "200":
          description: Updated
    delete:
      operationId: deleteBeneficiary
      tags: [beneficiaries]
      summary: Delete beneficiary
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  # ── NOTIFICATIONS ─────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked read

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All marked read

  /notifications/{id}:
    delete:
      operationId: deleteNotification
      tags: [notifications]
      summary: Delete notification
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  # ── PROFILE ───────────────────────────────────────────────────────────
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Profile updated

  /profile/change-password:
    post:
      operationId: changePassword
      tags: [profile]
      summary: Change password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed

  # ── ADMIN ─────────────────────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Platform statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /admin/users/{id}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: Get user details with accounts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /admin/users/{id}/suspend:
    post:
      operationId: suspendUser
      tags: [admin]
      summary: Suspend user account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User suspended

  /admin/users/{id}/unsuspend:
    post:
      operationId: unsuspendUser
      tags: [admin]
      summary: Unsuspend user account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User unsuspended

  /admin/fund-account:
    post:
      operationId: fundAccount
      tags: [admin]
      summary: Credit user account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundAccountInput"
      responses:
        "200":
          description: Account funded

  /admin/debit-account:
    post:
      operationId: debitAccount
      tags: [admin]
      summary: Debit user account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebitAccountInput"
      responses:
        "200":
          description: Account debited

  /admin/transactions:
    get:
      operationId: listAdminTransactions
      tags: [admin]
      summary: All platform transactions
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /admin/transactions/{id}/reverse:
    post:
      operationId: reverseTransaction
      tags: [admin]
      summary: Reverse a transaction
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction reversed

  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [admin]
      summary: Audit log
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          {}
      required:
        - success

    # ── Auth Schemas ──────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        phone:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshTokenInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string

    EmailInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordInput:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8

    User:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
        isEmailVerified:
          type: boolean
        avatarUrl:
          type: ["string", "null"]
        kycStatus:
          type: string
        createdAt:
          type: string
      required: [id, firstName, lastName, email, role]

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
            accessToken:
              type: string
            refreshToken:
              type: string
      required: [success]

    TokenResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            accessToken:
              type: string

    # ── Account Schemas ───────────────────────────────────────────────
    Account:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        accountNumber:
          type: string
        accountType:
          type: string
          enum: [CHECKING, SAVINGS, MONEY_MARKET, FIXED_DEPOSIT]
        balance:
          type: string
        currency:
          type: string
        status:
          type: string
          enum: [ACTIVE, FROZEN, CLOSED]
        nickname:
          type: ["string", "null"]
        isPrimary:
          type: boolean
        routingNumber:
          type: string
        interestRate:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, accountNumber, accountType, balance, currency, status]

    AccountInput:
      type: object
      properties:
        accountType:
          type: string
          enum: [CHECKING, SAVINGS, MONEY_MARKET, FIXED_DEPOSIT]
        currency:
          type: string
        nickname:
          type: ["string", "null"]

    AccountUpdate:
      type: object
      properties:
        nickname:
          type: ["string", "null"]

    AccountResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Account"

    AccountListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    AccountStatsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            totalBalance:
              type: string
            accountCount:
              type: integer

    # ── Transaction Schemas ───────────────────────────────────────────
    Transaction:
      type: object
      properties:
        id:
          type: integer
        accountId:
          type: integer
        userId:
          type: integer
        refNumber:
          type: string
        type:
          type: string
          enum: [DEPOSIT, WITHDRAWAL, TRANSFER_IN, TRANSFER_OUT, FEE, INTEREST, REVERSAL, ADMIN_CREDIT]
        amount:
          type: string
        balanceBefore:
          type: string
        balanceAfter:
          type: string
        currency:
          type: string
        description:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED, REVERSED, HELD]
        counterpartName:
          type: ["string", "null"]
        counterpartBank:
          type: ["string", "null"]
        counterpartAccountNumber:
          type: ["string", "null"]
        holdReason:
          type: ["string", "null"]
        cotAmount:
          type: ["string", "null"]
        taxAmount:
          type: ["string", "null"]
        chargesNote:
          type: ["string", "null"]
        cotPaid:
          type: boolean
        taxPaid:
          type: boolean
        createdAt:
          type: string
      required: [id, refNumber, type, amount, status]

    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer

    TransactionResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Transaction"

    TransactionPageResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Transaction"
            pagination:
              $ref: "#/components/schemas/Pagination"

    TransactionSummaryResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            monthlyIncome:
              type: string
            monthlyExpenses:
              type: string
            transactionCount:
              type: integer

    # ── Transfer Schemas ──────────────────────────────────────────────
    InternalTransferInput:
      type: object
      required: [fromAccountId, toAccountId, amount]
      properties:
        fromAccountId:
          type: integer
        toAccountId:
          type: integer
        amount:
          type: string
        note:
          type: ["string", "null"]

    ExternalTransferInput:
      type: object
      required: [fromAccountId, recipientName, recipientAccountNumber, amount]
      properties:
        fromAccountId:
          type: integer
        recipientName:
          type: string
        recipientBank:
          type: ["string", "null"]
        recipientAccountNumber:
          type: string
        routingNumber:
          type: ["string", "null"]
        amount:
          type: string
        note:
          type: ["string", "null"]

    # ── Beneficiary Schemas ───────────────────────────────────────────
    Beneficiary:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        accountNumber:
          type: string
        routingNumber:
          type: ["string", "null"]
        bankName:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
