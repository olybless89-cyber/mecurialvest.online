name: Deploy to Vercel + Run Supabase Migrations

on:
  push:
    branches:
      - main
      - master

jobs:
  # ─────────────────────────────────────────────────
  # JOB 1: Run SQL migrations against Supabase
  # ─────────────────────────────────────────────────
  migrate:
    name: Run SQL Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          curl -sSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin supabase
          supabase --version

      - name: Run all pending SQL migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -o pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "⚠️  SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets are not set."
            echo "    Skipping migrations. Add them under Settings → Secrets → Actions."
            exit 0
          fi
          echo "Running migrations on project: $SUPABASE_PROJECT_REF"
          # Use the Supabase Management API executeSql endpoint — it works with
          # just the access token + project ref (no DB password / pooler host
          # needed), and runs each statement as the postgres superuser. The
          # `supabase db execute` CLI subcommand is not stable across versions.
          API="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          for file in $(ls SQL/supabase/*.sql | sort); do
            echo "──────────────────────────────────────"
            echo "▶ Applying: $file"
            # Strip leading SQL-line comments so the payload stays small; the
            # API accepts multiple statements separated by ';'.
            SQL=$(sed -E 's/^[[:space:]]*--.*$//' "$file" | tr -d '\r')
            HTTP=$(curl -s -o /tmp/migrate.out -w '%{http_code}' \
              -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "import json,sys; print(json.dumps({'query': sys.stdin.read()}))" <<< "$SQL")")
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then
              echo "✅ Done: $file"
            else
              echo "⚠️  Skipped ($HTTP): $file"
              head -c 500 /tmp/migrate.out
              echo
            fi
          done

  # ─────────────────────────────────────────────────
  # JOB 2: Deploy frontend to Vercel
  # Runs after migrations succeed
  # ─────────────────────────────────────────────────
  deploy:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel project (from secrets, if not already linked)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          if [ ! -f .vercel/project.json ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            printf '{"orgId":"%s","projectId":"%s","settings":{}}\n' \
              "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
            echo "Wrote .vercel/project.json from VERCEL_ORG_ID / VERCEL_PROJECT_ID"
          fi
          cat .vercel/project.json 2>/dev/null || echo "no project.json (Vercel secrets missing)"

      - name: Deploy to Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "⚠️  VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets are not set."
            echo "    Skipping Vercel deploy. Add them under Settings → Secrets → Actions."
            exit 0
          fi
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
