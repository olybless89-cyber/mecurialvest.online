name: Run Supabase Migrations

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  migrate:
    name: Run SQL Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run all pending SQL migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "⚠️  SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets are not set."
            echo "    Skipping migrations. Add them under Settings → Secrets → Actions."
            exit 0
          fi
          echo "Running migrations on project: $SUPABASE_PROJECT_REF"
          # The Management API executeSql endpoint runs each statement as the
          # postgres superuser with just the access token + project ref.
          API="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          FAILED=0
          for file in $(ls SQL/supabase/*.sql | sort); do
            echo "──────────────────────────────────────"
            echo "▶ Applying: $file"
            # Strip leading full-line SQL comments so the payload stays small.
            SQL=$(sed -E 's/^[[:space:]]*--.*$//' "$file" | tr -d '\r')
            HTTP=$(curl -s -o /tmp/migrate.out -w '%{http_code}' \
              -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "import json,sys; print(json.dumps({'query': sys.stdin.read()}))" <<< "$SQL")")
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then
              echo "✅ Done: $file"
            else
              echo "❌ FAILED ($HTTP): $file"
              head -c 500 /tmp/migrate.out
              echo
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "One or more migrations failed — the run is marked failed so the"
            echo "failure is visible instead of silently skipped."
            exit 1
          fi
